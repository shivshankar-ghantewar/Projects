<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body >
    {% include 'nav.html'%}
    <div style="display: flex; justify-content: center;">
        <form style="width: 50%; margin-top: 20px; border: 2px solid black; padding: 15px; border-radius: 10px;" action="/profileupdate" method="post">
      <input type="hidden" value="{{data[0]}}" name="id">
        <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Name</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="name" value="{{data[1]}}">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email" value="{{data[2]}}">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">contact</label>
    <input type="number" class="form-control" id="exampleInputPassword1" name="contact" value="{{data[3]}}">
  </div>
  <div class="input-group">
  <span class="input-group-text">messege</span>
  <textarea class="form-control" aria-label="With textarea" name="messege" >{{data[4]}}</textarea>
</div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1" name="messege">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Update Now</button>
</form>
 </div>
</body>
</html>
