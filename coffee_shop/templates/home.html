<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{url_for('static',filename='css/index.css')}}">

  <style>
    .carousel-item img {
      width: 100%;
      height: 500px;
      object-fit: fill;
    }
  </style>
</head>

<body>
  <div class="navbar-container">
    {% include 'nav.html'%}
  </div>
  <div id="carouselExampleInterval" class="carousel slide" data-bs-autoplay="true">
    <div class="carousel-inner rounded-5">
      <div class="carousel-item active" data-bs-interval="2000" class="shiv">
        <img src="{{url_for('static',filename='images/coffee1.png')}}" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item" data-bs-interval="2000" class="shiv">
        <img src="{{url_for('static',filename='images/coffee2.png')}}" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item" data-bs-interval="2000" class="shiv">
        <img src="{{url_for('static',filename='images/coffee3.png')}}" class="d-block w-100" alt="...">
      </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active"
          aria-current="true" aria-label="slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1"
          aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2"
          aria-label="Slide 3"></button>
      </div>
      <button class="btn-icon btn-sm carousel-control-play-pause" type="button"
        data-bs-target="#carouselExampleInterval" aria-label="Pause" data-bs-pause-label="Pause"
        data-bs-play-label="Play">
        <span class="carousel-icon-pause" aria-hidden="true"></span>
        <span class="carousel-icon-play" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</body>

</html>
